{{- if not .Values.postgres.enabled }}
{{- $_ := include "waterblocks.database.validate" . }}
{{- if not .Values.externalDatabase.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "waterblocks.database.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "waterblocks.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
stringData:
  DefaultConnection: {{ include "waterblocks.externalDatabase.connectionString" . | quote }}
{{- end }}
{{- end }}
