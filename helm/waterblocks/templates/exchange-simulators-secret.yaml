{{- $tokens := dict }}
{{- range $exchangeType, $simulator := .Values.api.exchangeSimulators }}
{{- if and $simulator.adminToken (not $simulator.existingSecret) }}
{{- $_ := set $tokens (printf "%s_ADMIN_TOKEN" $exchangeType) $simulator.adminToken }}
{{- end }}
{{- end }}
{{- if $tokens }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "waterblocks.exchangeSimulators.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "waterblocks.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
stringData:
  {{- range $key, $token := $tokens }}
  {{ $key }}: {{ $token | quote }}
  {{- end }}
{{- end }}
