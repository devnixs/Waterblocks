name: waterblocks-ci

# Runs tests on every branch/PR.
# On push to main only: if tests pass, builds and pushes Docker images to AWS ECR.

permissions:
  id-token: write        # Required for GitHub OIDC → AWS
  contents: read

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────────────
# Shared env vars — update ECR_REPOSITORY here if the repo name ever changes
# ─────────────────────────────────────────────────────────────────────────────
env:
  ECR_REPOSITORY: waterblocks    # ECR repo name in account 204494792036, region eu-west-1

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build and Test
  # Runs on every branch push and every PR.
  # Acts as the quality gate — ECR push jobs depend on this passing.
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute build metadata
        id: build-meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # ── .NET backend ──────────────────────────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore .NET
        run: dotnet restore ./Waterblocks.Api/Waterblocks.Api.csproj

      - name: Build .NET
        run: dotnet build ./Waterblocks.Api/Waterblocks.Api.csproj --configuration Release --no-restore

      - name: Run integration tests
        run: dotnet test tests/backend/integration/Waterblocks.IntegrationTests.csproj --configuration Release --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=detailed"
        env:
          ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres;Include Error Detail=True"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"

      # ── Frontend Admin UI ─────────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: waterblocks-admin/package-lock.json

      - name: Validate specs and stories
        run: npm run validate:workflow

      - name: Install frontend deps
        run: npm ci
        working-directory: waterblocks-admin

      - name: Build frontend
        run: npm run build
        working-directory: waterblocks-admin
        env:
          VITE_APP_COMMIT_HASH: ${{ steps.build-meta.outputs.short_sha }}

      # ── E2E Smoke Tests ───────────────────────────────────────────────────
      - name: Install e2e deps
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run Playwright smoke tests
        run: npm test
        working-directory: e2e
        env:
          ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres;Include Error Detail=True"

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Build and push Backend API image to AWS ECR
  # Only runs on push to main, and only if build-and-test passes.
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push-api:
    name: Build and push API image
    runs-on: ubuntu-latest
    needs: build-and-test

    # Only push images when tests have passed on a real push to main (not PRs)
    if: github.event_name == 'push' && github.ref_name == 'main'
    environment:
      name: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate to AWS via OIDC (no long-lived keys stored as secrets)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: github-oidc-build

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Waterblocks.Api/Dockerfile from repo root context
      # Pushes two tags:
      #   waterblocks:api-<sha>   — pinned, immutable, traceable
      #   waterblocks:api-latest  — mutable, used by k8s deployment
      - name: Build, tag, and push API image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Waterblocks.Api/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:api-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Build and push Frontend Admin UI image to AWS ECR
  # Only runs on push to main, and only if build-and-test passes.
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push-admin:
    name: Build and push Admin UI image
    runs-on: ubuntu-latest
    needs: build-and-test

    # Only push images when tests have passed on a real push to main (not PRs)
    if: github.event_name == 'push' && github.ref_name == 'main'
    environment:
      name: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate to AWS via OIDC (no long-lived keys stored as secrets)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: github-oidc-build

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build waterblocks-admin/Dockerfile from the waterblocks-admin/ context
      # Pushes two tags:
      #   waterblocks:admin-<sha>   — pinned, immutable, traceable
      #   waterblocks:admin-latest  — mutable, used by k8s deployment
      - name: Build, tag, and push Admin UI image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./waterblocks-admin
          file: ./waterblocks-admin/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: |
            VITE_APP_COMMIT_HASH=${{ github.sha }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:admin-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}
