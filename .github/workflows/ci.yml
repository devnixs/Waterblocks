name: CI
run-name: "Build, Test and push docker images - ${{ github.ref_name }}"

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-and-docker-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute build metadata
        id: build-meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore .NET
        run: dotnet restore ./Waterblocks.Api/Waterblocks.Api.csproj

      - name: Build .NET
        run: dotnet build ./Waterblocks.Api/Waterblocks.Api.csproj --configuration Release --no-restore

      - name: Run integration tests
        run: dotnet test tests/backend/integration/Waterblocks.IntegrationTests.csproj --configuration Release --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=detailed"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: waterblocks-admin/package-lock.json

      - name: Validate specs and stories
        run: npm run validate:workflow

      - name: Install frontend deps
        run: npm ci
        working-directory: waterblocks-admin

      - name: Build frontend
        run: npm run build
        working-directory: waterblocks-admin
        env:
          VITE_APP_COMMIT_HASH: ${{ steps.build-meta.outputs.short_sha }}

      - name: Install e2e deps
        run: npm install
        working-directory: e2e

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run Playwright smoke tests
        run: npm test
        working-directory: e2e
        env:
          ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres;Include Error Detail=True"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API image
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Waterblocks.Api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Extract metadata for Admin UI image
        id: meta-admin
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/admin
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push Admin UI Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./waterblocks-admin
          file: ./waterblocks-admin/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-admin.outputs.tags }}
          labels: ${{ steps.meta-admin.outputs.labels }}
          build-args: |
            VITE_APP_COMMIT_HASH=${{ steps.build-meta.outputs.short_sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
